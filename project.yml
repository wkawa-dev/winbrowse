name: WinBrowse
options:
  bundleIdPrefix: dev.winbrowse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    WB_REPORTS_URL: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  WinBrowse:
    type: application
    platform: iOS
    scheme:
      testTargets: [WinBrowseTests]
    preBuildScripts:
      - name: Fetch the Public Suffix List
        script: scripts/fetch-public-suffix-list.sh
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/App/Resources/public_suffix_list.dat
    sources:
      - path: App
        excludes:
          - Extensions-bundle
          - Resources/public_suffix_list.dat
      - path: App/Resources/public_suffix_list.dat
        optional: true
        buildPhase: resources
      - path: App/Extensions-bundle
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.winbrowse.browser
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WinBrowse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WBReportsURL: $(WB_REPORTS_URL)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Websites can ask to use the camera.
        NSMicrophoneUsageDescription: Websites can ask to use the microphone.
        NSLocationWhenInUseUsageDescription: Websites can ask for your location.
        NSPhotoLibraryAddUsageDescription: Save images from web pages.
        NSFaceIDUsageDescription: Passkeys unlock with Face ID when a site asks you to sign in.
        CFBundleURLTypes:
          - CFBundleURLName: dev.winbrowse.browser
            CFBundleURLSchemes: [winbrowse]
  WinBrowseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
    dependencies:
      - target: WinBrowse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.winbrowse.tests
        GENERATE_INFOPLIST_FILE: YES
